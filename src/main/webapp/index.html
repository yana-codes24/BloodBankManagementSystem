<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Bank Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f1f1;
            color: #333;
        }

        header {
            background: #a71930;
            color: white;
            padding: 22px 8%;
            font-size: 24px;
            font-weight: bold;
        }

        .hero {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .hero h1 {
            color: #a71930;
            font-size: 42px;
            margin-bottom: 18px;
        }

        .hero p {
            max-width: 650px;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background: #a71930;
            color: white;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 6px;
            font-size: 17px;
        }

        .btn:hover {
            background: #7f1023;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 18px;
        }
    </style>
</head>

<body>

    <header>
        Blood Bank Management System
    </header>

    <section class="hero">
        <h1>Welcome to Blood Bank Management System</h1>

        <p>
            A platform designed to manage blood donors and support
            efficient blood bank operations. Access donor records
            and manage blood bank information through one system.
        </p>

        <a href="login.jsp" class="btn">Admin Login</a>
    </section>

    <footer>
        Blood Bank Management System | AJT Mini Project
    </footer>

</body>
</html>
